# Release pipeline: triggered by pushing a tag matching v*.
# Re-runs the verification gates, then signs the APK with the release
# keystore (GHA secrets of the protected `release` environment) and
# attaches it to a GitHub Release. Every action is pinned to a commit
# SHA (the release tag is the trailing comment); Dependabot bumps both.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build signed APK + GitHub Release
    runs-on: ubuntu-latest
    # The `release` environment holds the signing secrets and requires the
    # owner's approval before this job may read them (docs/BUILD.md).
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify before signing
        # The tag is not trusted to have been built from a green master: the
        # same gates as build.yml run here, before the keystore touches disk.
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :core:crypto:test \
            :core:proton-api:test \
            :core:proton-contacts:test \
            :core:storage:test \
            :core:contacts-writer:test \
            :core:sync:test \
            :feature:onboarding:test \
            :feature:settings:test \
            :tools:lint:test \
            detekt \
            :app:lintDebug \
            checkForbiddenDependencies \
            :app:checkLicense

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore

      - name: Build signed release APK
        # app/build.gradle.kts reads the signing configuration from these
        # environment variables; nothing is passed on the command line.
        env:
          RELEASE_STORE_FILE: /tmp/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Compute checksums
        run: |
          cd app/build/outputs/apk/release/
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Shred keystore
        if: always()
        run: shred -u /tmp/release.keystore 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
