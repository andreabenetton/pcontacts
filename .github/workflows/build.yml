name: build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'   # Monday 09:00 UTC — weekly vulnerability scan
  workflow_dispatch:

# Cancel in-progress runs for the same branch when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    if: github.event_name != 'schedule'
    name: Unit tests (all modules)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run unit tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :core:crypto:test \
            :core:proton-api:test \
            :core:proton-contacts:test \
            :core:storage:test \
            :core:contacts-writer:test \
            :core:sync:test \
            :feature:onboarding:test \
            :feature:settings:test \
            :tools:lint:test

      # ADR-0024: the committed dependency audit snapshot must list exactly the
      # resolved release classpath (a bump without a regenerated snapshot fails).
      - name: Verify dependency audit snapshot
        run: ./gradlew --no-daemon --stacktrace :app:verifyDependencyAudit

      - name: Generate coverage report (Kover)
        if: success()
        run: ./gradlew --no-daemon --stacktrace koverXmlReport koverHtmlReport

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: |
            build/reports/kover/

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/

  assemble-debug:
    if: github.event_name != 'schedule'
    name: Assemble debug + lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble debug
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Lint debug
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug

      - name: Detekt (static analysis)
        run: ./gradlew --no-daemon --stacktrace detekt

      - name: ADR-0015 forbidden-dependency check
        # Fails if any module's release classpath pulls in Google Play
        # Services, Firebase, analytics SDKs, etc.
        run: ./gradlew --no-daemon --stacktrace checkForbiddenDependencies

      - name: ADR-0015 license-compatibility check
        # Fails if any dependency in :app's release classpath carries a
        # license not on the ADR-0015 allowlist (config/allowed-licenses.json).
        run: ./gradlew --no-daemon --stacktrace :app:checkLicense

      - name: Upload lint report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  instrumented-tests:
    if: github.event_name != 'schedule'
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    strategy:
      # 26 = minSdk, 33 = the long-standing lane, 35 = targetSdk (runtime
      # behaviour changes are gated on targetSdk, so that is the boundary
      # worth testing). [U] API 35 x86_64 exists only as a google_apis image.
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 33
            target: default
          - api-level: 35
            target: google_apis
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          script: >-
            ./gradlew --no-daemon --stacktrace
            :core:contacts-writer:connectedDebugAndroidTest
            :core:storage:connectedDebugAndroidTest
            :feature:onboarding:connectedDebugAndroidTest
            :feature:settings:connectedDebugAndroidTest

      - name: Upload instrumented test reports on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/

  assemble-release-r8:
    if: github.event_name != 'schedule'
    name: Assemble release (R8 minified)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Assemble release
        # Exercises proguard-rules.pro — catches missing keep rules for
        # BouncyCastle / kotlinx-serialization / Retrofit / Room / etc.
        # verifyManifestInvariants runs as a dependency of assembleRelease.
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: ADR-0009 manifest invariant check
        # Already ran as assembleRelease dependency; explicit step for log visibility.
        run: ./gradlew --no-daemon --stacktrace :app:verifyManifestInvariants

      - name: Upload mapping + missing-rules artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-output
          path: |
            app/build/outputs/mapping/release/

  reproducible-build:
    if: github.event_name != 'schedule'
    name: Reproducible build (diffoscope)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build A
        # No signing env is passed: AGP emits pcontacts-release-unsigned.apk
        # rather than the signed pcontacts-release.apk. Unsigned bytes are
        # what we want here — release signing inserts a wall-clock timestamp
        # that would defeat byte-for-byte reproducibility on its own.
        run: |
          ./gradlew --no-daemon --no-build-cache --stacktrace \
            --project-cache-dir=/tmp/repro-a/cache \
            :app:assembleRelease
          cp app/build/outputs/apk/release/pcontacts-release-unsigned.apk \
            /tmp/repro-a.apk

      - name: Clean between builds
        run: ./gradlew --no-daemon clean

      - name: Build B
        run: |
          ./gradlew --no-daemon --no-build-cache --stacktrace \
            --project-cache-dir=/tmp/repro-b/cache \
            :app:assembleRelease
          cp app/build/outputs/apk/release/pcontacts-release-unsigned.apk \
            /tmp/repro-b.apk

      - name: Quick hash check
        run: |
          echo "Build A:" && sha256sum /tmp/repro-a.apk
          echo "Build B:" && sha256sum /tmp/repro-b.apk

      - name: Install diffoscope
        run: sudo apt-get update && sudo apt-get install -y diffoscope

      - name: Compare with diffoscope
        run: |
          diffoscope \
            --max-report-size=10485760 \
            --html /tmp/diffoscope-report.html \
            /tmp/repro-a.apk /tmp/repro-b.apk

      - name: Upload diffoscope report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diffoscope-report
          path: /tmp/diffoscope-report.html

  vulnerability-scan:
    name: osv.dev vulnerability check
    # Runs on every trigger (push, pull_request, schedule, workflow_dispatch).
    # osv.dev needs no key, so Dependabot's pull requests (which get no
    # repository secrets) run it like any other (ADR-0024, 2026-10-15).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # ADR-0024: asks osv.dev about every artifact of the release classpath.
      # Fails on an open advisory the shipped snapshot does not list, and on
      # any open HIGH or CRITICAL advisory not assessed in the suppression
      # file. The fix is a dependency bump, a regenerated snapshot or an
      # assessed suppression, never silence.
      - name: Check the release classpath against osv.dev
        run: ./gradlew --no-daemon --stacktrace :app:verifyDependencyAudit -PauditLive=true
