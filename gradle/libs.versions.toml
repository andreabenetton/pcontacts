# Version catalog — pcontacts
# Pins every external dependency by version, library coordinate, and bundle
# so build files reference aliases (libs.kotlin.coroutines.core) instead of
# raw strings. Keeping this file the single source of truth makes dependency
# bumps reviewable in isolation and prevents per-module version drift.
#
# License-compatibility note: every entry below is GPL-3.0-compatible (see
# docs/adr/0001-license-gpl-3-only.md and docs/adr/0015-no-telemetry-no-google-services.md).

[versions]
# Build tooling
agp                          = "8.11.2"
kotlin                       = "2.3.21"
ksp                          = "2.3.10"
java                         = "17"
dependency-check             = "12.2.2"
detekt                       = "1.23.8"
kover                        = "0.9.9"
android-lint                 = "31.11.2"

# Android platform
android-compile-sdk          = "36"
android-target-sdk           = "35"
android-min-sdk              = "26"

# AndroidX
androidx-activity            = "1.9.3"
androidx-activity-compose    = "1.9.3"
androidx-compose-bom         = "2026.05.01"
androidx-lifecycle-runtime-compose = "2.8.7"
androidx-biometric           = "1.2.0-alpha05"
androidx-core                = "1.13.1"
androidx-credentials         = "1.3.0"
androidx-room                = "2.7.2"
androidx-security-crypto     = "1.1.0-alpha06"
androidx-work                = "2.9.1"

# Kotlin libs
kotlinx-coroutines           = "1.11.0"
kotlinx-serialization        = "1.11.0"

# Networking
okhttp                       = "5.4.0"
retrofit                     = "3.0.0"

# Crypto + vCard
bouncycastle                 = "1.84"
ezvcard                      = "0.12.2"

# Test
junit                        = "4.13.2"
kotest                       = "6.2.3"
robolectric                  = "4.16.1"
androidx-test-junit          = "1.2.1"
androidx-test-espresso       = "3.6.1"
androidx-test-runner         = "1.6.2"
androidx-test-rules          = "1.6.1"

[libraries]
# Kotlin
kotlinx-coroutines-core      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",       version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-android   = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",    version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test      = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",       version.ref = "kotlinx-coroutines" }
kotlinx-serialization-json   = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",    version.ref = "kotlinx-serialization" }

# AndroidX
androidx-activity            = { group = "androidx.activity",     name = "activity-ktx",                  version.ref = "androidx-activity" }
androidx-activity-compose    = { group = "androidx.activity",     name = "activity-compose",              version.ref = "androidx-activity-compose" }
androidx-compose-bom         = { group = "androidx.compose",      name = "compose-bom",                   version.ref = "androidx-compose-bom" }
androidx-compose-material3   = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui          = { group = "androidx.compose.ui",   name = "ui" }
androidx-compose-ui-tooling  = { group = "androidx.compose.ui",   name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4    = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest  = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-foundation  = { group = "androidx.compose.foundation", name = "foundation" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle-runtime-compose" }
androidx-lifecycle-viewmodel     = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx",   version.ref = "androidx-lifecycle-runtime-compose" }
androidx-biometric           = { group = "androidx.biometric",    name = "biometric-ktx",                 version.ref = "androidx-biometric" }
androidx-core-ktx            = { group = "androidx.core",         name = "core-ktx",                      version.ref = "androidx-core" }
androidx-credentials         = { group = "androidx.credentials",  name = "credentials",                   version.ref = "androidx-credentials" }
androidx-room-runtime        = { group = "androidx.room",         name = "room-runtime",                  version.ref = "androidx-room" }
androidx-room-ktx            = { group = "androidx.room",         name = "room-ktx",                      version.ref = "androidx-room" }
androidx-room-compiler       = { group = "androidx.room",         name = "room-compiler",                 version.ref = "androidx-room" }
androidx-room-testing        = { group = "androidx.room",         name = "room-testing",                  version.ref = "androidx-room" }
androidx-security-crypto     = { group = "androidx.security",     name = "security-crypto",               version.ref = "androidx-security-crypto" }
androidx-work-runtime-ktx    = { group = "androidx.work",         name = "work-runtime-ktx",              version.ref = "androidx-work" }
androidx-work-testing        = { group = "androidx.work",         name = "work-testing",                  version.ref = "androidx-work" }

# Networking
okhttp                       = { group = "com.squareup.okhttp3",  name = "okhttp",                        version.ref = "okhttp" }
okhttp-logging               = { group = "com.squareup.okhttp3",  name = "logging-interceptor",           version.ref = "okhttp" }
okhttp-mockwebserver         = { group = "com.squareup.okhttp3",  name = "mockwebserver",                 version.ref = "okhttp" }
retrofit                     = { group = "com.squareup.retrofit2", name = "retrofit",                     version.ref = "retrofit" }
retrofit-kotlinx-serialization-converter = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }

# Crypto
bouncycastle-bcpg            = { group = "org.bouncycastle",      name = "bcpg-jdk18on",                  version.ref = "bouncycastle" }
bouncycastle-bcprov          = { group = "org.bouncycastle",      name = "bcprov-jdk18on",                version.ref = "bouncycastle" }

# vCard
ezvcard                      = { group = "com.googlecode.ez-vcard", name = "ez-vcard",                    version.ref = "ezvcard" }

# Android Lint (for custom check module in :tools:lint)
android-lint-api             = { group = "com.android.tools.lint", name = "lint-api",                     version.ref = "android-lint" }
android-lint-checks          = { group = "com.android.tools.lint", name = "lint-checks",                  version.ref = "android-lint" }
android-lint                 = { group = "com.android.tools.lint", name = "lint",                         version.ref = "android-lint" }
android-lint-tests           = { group = "com.android.tools.lint", name = "lint-tests",                   version.ref = "android-lint" }

# Test
junit                        = { group = "junit",                 name = "junit",                         version.ref = "junit" }
kotest-runner-junit5         = { group = "io.kotest",             name = "kotest-runner-junit5",          version.ref = "kotest" }
kotest-assertions-core       = { group = "io.kotest",             name = "kotest-assertions-core",        version.ref = "kotest" }
kotest-property              = { group = "io.kotest",             name = "kotest-property",               version.ref = "kotest" }
robolectric                  = { group = "org.robolectric",       name = "robolectric",                   version.ref = "robolectric" }
androidx-test-junit          = { group = "androidx.test.ext",     name = "junit",                         version.ref = "androidx-test-junit" }
androidx-test-espresso-core  = { group = "androidx.test.espresso", name = "espresso-core",                version.ref = "androidx-test-espresso" }
androidx-test-runner         = { group = "androidx.test",         name = "runner",                        version.ref = "androidx-test-runner" }
androidx-test-rules          = { group = "androidx.test",         name = "rules",                         version.ref = "androidx-test-rules" }

[bundles]
kotlinx-coroutines           = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
okhttp                       = ["okhttp", "okhttp-logging"]
room                         = ["androidx-room-runtime", "androidx-room-ktx"]
bouncycastle                 = ["bouncycastle-bcpg", "bouncycastle-bcprov"]
kotest                       = ["kotest-runner-junit5", "kotest-assertions-core", "kotest-property"]

[plugins]
android-application          = { id = "com.android.application",            version.ref = "agp" }
android-library              = { id = "com.android.library",                version.ref = "agp" }
android-lint                 = { id = "com.android.lint",                   version.ref = "agp" }
kotlin-android               = { id = "org.jetbrains.kotlin.android",       version.ref = "kotlin" }
kotlin-compose               = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm                   = { id = "org.jetbrains.kotlin.jvm",           version.ref = "kotlin" }
kotlin-serialization         = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                          = { id = "com.google.devtools.ksp",            version.ref = "ksp" }
dependency-check             = { id = "org.owasp.dependencycheck",          version.ref = "dependency-check" }
detekt                       = { id = "io.gitlab.arturbosch.detekt",        version.ref = "detekt" }
kover                        = { id = "org.jetbrains.kotlinx.kover",        version.ref = "kover" }
